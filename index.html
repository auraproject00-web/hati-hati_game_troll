<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10302c">
<meta name="description" content="Hati Hati - game platformer troll 50 level.">
<title>Hati Hati</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: canvas game di atas, bar tombol sentuh di bawah. Satu tema gelap toska (sengaja). */
:root{
  --bg:#10302c; --panel:#174640; --btn:#2a7d72; --btnOn:#ffc83c; --ink:#f4e4bc; --line:#0b201d;
  --pix:'Press Start 2P', ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%;touch-action:manipulation;}
body{background:var(--bg);color:var(--ink);font-family:var(--pix);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;}
canvas{display:block;image-rendering:pixelated;border:3px solid var(--line);border-radius:4px;max-width:100%;background:#000;}
#pad{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;gap:12px;}
.grp{display:flex;gap:12px;}
.b{width:74px;height:62px;border:3px solid var(--line);border-radius:10px;background:var(--btn);color:var(--ink);
  font-family:var(--pix);font-size:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 var(--line);touch-action:none;cursor:pointer;}
.b.on{background:var(--btnOn);color:var(--line);transform:translateY(3px);box-shadow:0 2px 0 var(--line);}
.b:focus-visible{outline:3px solid var(--btnOn);outline-offset:2px;}
#bj{width:96px;}
#bm{width:52px;height:44px;font-size:14px;}
#breset{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:5;
  font-family:var(--pix);font-size:9px;padding:9px 12px;border:3px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer;}
#breset.confirm{background:#e2574c;color:#fff;}
#breset:focus-visible{outline:3px solid var(--btnOn);outline-offset:2px;}
#bm.off{opacity:.45;text-decoration:line-through;}
#tip{font-size:8px;opacity:.6;text-align:center;line-height:1.6;}
@media (hover:hover) and (pointer:fine){ #tip{display:block} }
@media (prefers-reduced-motion: reduce){ .b{transition:none} }
/* Landscape HP: game di atas, baris tombol di bawah (lebih pendek biar game tetap besar) */
@media (orientation:landscape) and (max-height:560px){
  #app{gap:8px;padding-block:6px;}
  #tip{display:none;}
  #pad{max-width:none;}
  #pad .b{height:50px;width:76px;font-size:16px;}
  #pad #bj{width:120px;}
  #pad #bm{width:52px;height:40px;}
}
</style>

</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Game Hati Hati"></canvas>
  <div id="pad">
    <div class="grp">
      <button class="b" id="bl" aria-label="Kiri">◀</button>
      <button class="b" id="br" aria-label="Kanan">▶</button>
    </div>
    <button class="b" id="bm" aria-label="Musik nyala/mati">♪</button>
    <button class="b" id="bj" aria-label="Lompat">▲</button>
  </div>
  <button id="breset" type="button">↺ Reset jumlah mati</button>
  <div id="tip">Keyboard: ← → / A D buat jalan · Spasi / ↑ / W buat lompat</div>
</div>

<script>
(()=>{
const T=10, W=320, H=180, SC=4, COLS=32, ROWS=18;
const GRAV=1100, JUMP=320, RUN=85, MAXFALL=380;
const C={bg:'#f4e4bc',bg2:'#ead6a6',wall:'#2a7d72',wallL:'#46a596',wallD:'#1b544d',ink:'#1e1e28',
  door:'#2b2b36',gold:'#ffc83c',crack:'#b98a4e',grey:'#8a8a94',red:'#e2574c'};

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
cv.width=W*SC; cv.height=H*SC;
function fit(){
  const pad=document.getElementById('pad'), tip=document.getElementById('tip');
  const land=matchMedia('(orientation:landscape) and (max-height:560px)').matches;
  const availW=Math.min(window.innerWidth-32, 1280);
  const availH=land? window.innerHeight-pad.offsetHeight-40 : window.innerHeight-pad.offsetHeight-(tip.offsetHeight||0)-44;
  // isi lebar layar: area main tetap 16:9 di tengah, sisi kiri-kanan diisi tembok
  let h=Math.min(availH, availW*9/16*1.0), w=Math.min(availW, h*2.4);
  if(availW*9/16<availH){ h=availW*9/16; w=availW; }
  w=Math.floor(w); h=Math.floor(h);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
}
addEventListener('resize',fit); addEventListener('orientationchange',()=>setTimeout(fit,200));

/* ---------- simpan ---------- */
let save={lv:0,deaths:0,best:null};
try{const s=JSON.parse(localStorage.getItem('hatihati')); if(s) save=Object.assign(save,s);}catch(e){}
function store(){try{localStorage.setItem('hatihati',JSON.stringify(save));}catch(e){}}

/* ---------- input ---------- */
const DEV=false; // versi uji coba: pilih level di menu. Versi GitHub/Vercel = false
const keys={l:0,r:0,j:0}; let prevJ=0, prevL=0, prevR=0, jTap=0; // jTap: lompat yang ditekan-lepas sebelum update sempat jalan
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyW:'j'};
addEventListener('keydown',e=>{const k=km[e.code]; if(k){if(k==='j'&&!keys.j) jTap=1; keys[k]=1;e.preventDefault();audioInit();}});
addEventListener('keyup',e=>{const k=km[e.code]; if(k){keys[k]=0;e.preventDefault();}});
[['bl','l'],['br','r'],['bj','j']].forEach(([id,k])=>{
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();if(k==='j'&&!keys.j) jTap=1; keys[k]=1;el.classList.add('on');audioInit();};
  const off=e=>{e.preventDefault();keys[k]=0;el.classList.remove('on');};
  el.addEventListener('pointerdown',e=>{try{el.setPointerCapture(e.pointerId)}catch(_){}on(e);});
  el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
addEventListener('blur',()=>{keys.l=keys.r=keys.j=0;});
/* cegah zoom browser (double-tap & cubit) */
let lastTouch=0;
document.addEventListener('touchend',e=>{const n=Date.now(); if(n-lastTouch<350) e.preventDefault(); lastTouch=n;},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
(()=>{let m=document.querySelector('meta[name=viewport]'); if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m);}
  m.content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';})();

/* ---------- suara 8-bit ---------- */
let ac=null;
function audioInit(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); if(ac&&typeof startMusic==='function') startMusic(); }
function beep(f1,f2,dur,type='square',vol=.08){
  if(!ac) return; const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(f2,30),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
}
/* ---------- musik latar 8-bit (komposisi original) ---------- */
const mus={started:0,step:0,next:0,on:save.music!==false};
const rsEl=document.getElementById('breset'); let rsArm=0, rsTimer=null;
rsEl.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation();
  if(!rsArm){ rsArm=1; rsEl.classList.add('confirm'); rsEl.textContent='Yakin? Tap lagi'; clearTimeout(rsTimer);
    rsTimer=setTimeout(()=>{rsArm=0;rsEl.classList.remove('confirm');rsEl.textContent='↺ Reset jumlah mati';},3000); return; }
  rsArm=0; clearTimeout(rsTimer); save.deaths=0; store(); rsEl.classList.remove('confirm'); rsEl.textContent='✓ Udah 0 lagi'; if(typeof sfx!=='undefined') sfx.door();
  rsTimer=setTimeout(()=>{rsEl.textContent='↺ Reset jumlah mati';},1500);
});
const bmEl=document.getElementById('bm'); if(!mus.on) bmEl.classList.add('off');
// uji coba: pakai file MP3 kalau DEV (tidak ikut versi publik)
const bgm = DEV ? (()=>{ try{ const a=new Audio('music.mp3'); a.loop=true; a.volume=.2; a.preload='auto'; return a; }catch(e){ return null; } })() : null;
function syncBgm(){ if(!bgm) return; if(mus.on) bgm.play().catch(()=>{}); else bgm.pause(); }
function toggleMusic(){ mus.on=!mus.on; save.music=mus.on; store(); bmEl.classList.toggle('off',!mus.on); audioInit(); syncBgm(); }
bmEl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleMusic();});
addEventListener('keydown',e=>{ if(e.code==='KeyM') toggleMusic(); });
const BPM=152, E8=60/BPM/2;
const _=null;
// melodi (semitone dari C5), 64 langkah per 1/8
const LEAD=[0,_,4,7, 12,_,7,4, 5,_,9,12, 9,7,5,_,  4,_,7,11, 14,12,11,7, 9,7,5,4, 2,_,_,_,
            0,_,4,7, 12,_,7,4, 5,_,9,12, 14,12,9,_,  7,_,11,14, 12,_,7,_, 2,4,5,7, 12,_,0,_];
const ROOT=[0,0,5,5,7,7,7,7, 0,0,5,5,7,7,0,0]; // per setengah bar (4 langkah)
let noiseBuf=null;
function tone(f,t,d,type,v){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0008,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02); }
function hat(t,v){ if(!noiseBuf){ noiseBuf=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=ac.createBufferSource(), g=ac.createGain(), f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
  s.buffer=noiseBuf; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0008,t+.04); s.connect(f).connect(g).connect(ac.destination); s.start(t); }
const hz=n=>523.25*Math.pow(2,n/12);
function playStep(i,t){
  const n=LEAD[i]; if(n!==_) tone(hz(n),t,E8*.85,'square',.02);
  const root=ROOT[Math.floor(i/4)], q=i%4;
  if(q===0) tone(hz(root-24),t,E8*1.6,'triangle',.06);
  if(q===2) tone(hz(root-17),t,E8*1.2,'triangle',.045);
  if(i%2===1) hat(t,.014);
}
function sched(){ if(!ac) return; if(mus.next<ac.currentTime) mus.next=ac.currentTime+.05; /* habis tab di background: jangan nyusul nada yang ketinggalan */ while(mus.next<ac.currentTime+.15){ if(mus.on) playStep(mus.step,mus.next); mus.next+=E8; mus.step=(mus.step+1)%LEAD.length; } }
function startMusic(){ if(!ac||mus.started) return; mus.started=1; if(bgm){ syncBgm(); return; } mus.next=ac.currentTime+.1; setInterval(sched,30); }

const sfx={
  jump:()=>beep(380,760,.12),
  die:()=>{beep(300,40,.35,'sawtooth',.1);beep(120,30,.4,'square',.06);},
  door:()=>{beep(520,520,.08);setTimeout(()=>beep(660,660,.08),90);setTimeout(()=>beep(880,880,.14),180);},
  trap:()=>beep(900,200,.1,'triangle',.07),
  crack:()=>beep(200,90,.08,'triangle',.06),
};

/* ---------- peta ---------- */
function blank(){
  const m=[]; for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++){
    r.push((y===0||x===0||x===COLS-1||y>=15)?'#':'.');}m.push(r);} return m;
}
function fill(m,x1,y1,x2,y2,c){for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)m[y][x]=c;}
function pit(m,x1,x2){fill(m,x1,15,x2,16,'.');fill(m,x1,16,x2,16,'^');}

/* ---------- entitas jebakan ---------- */
const door=(tx,row=15,o={})=>Object.assign({kind:'door',x:tx*T,y:row*T-14,w:10,h:14},o);
const pop=(tx1,tx2,row,a,b,o={})=>Object.assign({kind:'pop',x:tx1*T,y:row*T,w:(tx2-tx1+1)*T,h:T,up:0,trig:[a*T,(b+1)*T]},o);
const crumble=(tx,ty,delay)=>({kind:'crumble',x:tx*T,y:ty*T,w:T,h:T,solid:true,delay,t:0,vy:0});
const block=(tx,ty,a,b,o={})=>Object.assign({kind:'block',x:tx*T,y:ty*T,w:T,h:T,solid:true,st:0,vy:0,trig:[a*T,(b+1)*T],wait:0},o);
const inv=(tx,ty)=>({kind:'inv',x:tx*T,y:ty*T,w:T,h:T,solid:true,seen:false});
const fake=(tx,ty)=>({kind:'fake',x:tx*T,y:ty*T,w:T,h:T});
const spring=(tx,power)=>({kind:'spring',x:tx*T,y:14*T,w:T,h:T,solid:true,power,boing:0});
const zone=(a,b,fn)=>({kind:'zone',trig:[a*T,(b+1)*T],fn,done:false});

const LEVELS=[
 {name:'Pemanasan', hint:'Jalan ke pintu. Gampang kok.', build(){
   const m=blank(); fill(m,13,13,15,14,'#'); pit(m,20,22);
   return {m, ents:[pop(26,27,14,25,27), door(28)]};
 }},
 {name:'Duri Nongol', hint:'Lantainya aman. Kayaknya.', build(){
   const m=blank();
   return {m, ents:[pop(16,17,14,15,17), pop(19,19,14,18,19), pop(24,26,14,23,26), block(28,14,27,28,{wait:0}), door(29)]};
 }},
 {name:'Lantai Rapuh', hint:'Jangan kelamaan berdiri.', build(){
   const m=blank(); pit(m,6,25); const e=[];
   for(let x=6;x<=25;x++) e.push(crumble(x,15,[11,16,21].includes(x)?0:.16));
   e.push(pop(26,27,14,26,27));
   e.push(door(28)); return {m, ents:e};
 }},
 {name:'Pintu Kabur', hint:'Pintunya di situ. Tinggal masuk.', build(){
   const m=blank();
   const d=door(20,15,{st:0,upd(e,g){
     const px=g.p.x+g.p.w/2, dx=Math.abs(px-(e.x+5));
     if(e.st===0&&dx<38){e.st=1;sfx.trap();say('Eh, kok kabur?');}
     if(e.st===1){e.x=Math.min(280,e.x+260*g.dt); if(e.x>=280)e.st=2;}
     if(e.st===2&&dx<26){e.st=3;sfx.trap();}
     if(e.st===3){e.y+=120*g.dt; if(e.y>=150){e.x=30;e.st=4;say('Balik lagi sana!');}}
     if(e.st===4){e.y=Math.max(136,e.y-120*g.dt); if(e.y<=136)e.st=5;}
     e.moving=(e.st===1||e.st===3||e.st===4);
   }});
   return {m, ents:[d, pop(6,6,14,6,7,{cond:g=>d.st>=4}), pop(9,10,14,9,11,{cond:g=>d.st>=1})]};
 }},
 {name:'Pintu Palsu', hint:'Pintu yang paling deket pasti benar.', build(){
   const m=blank(); fill(m,8,12,11,12,'#'); fill(m,14,9,17,9,'#'); fill(m,8,6,11,6,'#'); fill(m,2,3,5,3,'#');
   fill(m,2,3,5,3,'.'); const e=[door(28,15,{fake:true}), door(3,3), pop(15,16,8,15,16)];
   for(let x=2;x<=5;x++) e.push(crumble(x,3,.2));
   return {m, ents:e};
 }},
 {name:'Awas Atas', hint:'Lorongnya sempit. Santai aja.', build(){
   const m=blank(); fill(m,6,1,25,11,'#');
   m[11][12]='.'; m[11][13]='.'; m[11][20]='.'; m[11][21]='.'; m[11][16]='.'; m[11][17]='.';
   return {m, ents:[block(12,11,10,13),block(13,11,10,13),block(20,11,19,21,{wait:.05}),block(21,11,19,21,{wait:.05}),block(17,11,23,24,{wait:0}),block(16,11,23,24,{wait:0}),pop(27,27,14,26,27),door(29)]};
 }},
 {name:'Kebalik', hint:'Kok aneh ya?', rev:true, build(){
   const m=blank(); pit(m,9,10); pit(m,18,20);
   return {m, ents:[zone(14,15,g=>{g.rev=false;say('Eh, udah normal lagi.');sfx.trap();}), zone(22,22,g=>{g.rev=true;say('Canda. Kebalik lagi.');sfx.trap();}), pop(25,26,14,25,26), door(28)]};
 }},
 {name:'Percaya Aja', hint:'Batunya kuat kok.', build(){
   const m=blank(); pit(m,5,26); const e=[];
   for(const x of [9,14,19,23]) e.push(fake(x,15));
   for(let x=5;x<=26;x++) if(x!==15&&x!==16) e.push(inv(x,12));
   e.push(pop(27,27,14,27,27));
   e.push(door(28)); return {m, ents:e, helpAt:3, help:'Coba lompat lebih tinggi...'};
 }},
 {name:'Gabungan', hint:'Semua yang tadi. Sekaligus.', build(){
   const m=blank(); pit(m,7,12); fill(m,19,1,23,10,'#'); const e=[];
   for(let x=7;x<=12;x++) e.push(crumble(x,15,(x===9||x===11)?0:.15));
   e.push(pop(16,17,14,15,17));
   e.push(block(21,10,21,22,{wait:.05})); m[10][21]='.';
   e.push(door(25,15,{st:0,upd(e,g){
     const px=g.p.x+g.p.w/2;
     if(e.st===0&&Math.abs(px-(e.x+5))<30){e.st=1;sfx.trap();say('Masih aja ketipu.');}
     if(e.st===1){e.x=Math.min(290,e.x+240*g.dt); if(e.x>=290)e.st=2;}
     e.moving=e.st===1;
   }}));
   return {m, ents:e};
 }},
 {name:'Sabar', hint:'Pintunya kekunci. Hmm.', build(){
   const m=blank();
   return {m, ents:[pop(14,15,14,14,15,{cond:g=>g.lvTime>3}), pop(17,18,14,17,18,{cond:g=>g.lvTime>3}), door(16,15,{locked:true,upd(e,g){
     if(e.locked&&g.idle>=7){e.locked=false;sfx.door();say('Nah. Sabar itu kuncinya.');}
     if(e.locked&&g.lvTime>20&&!g.saidRest){g.saidRest=1;say('Capek? Istirahat dulu sana.');}
   }})]};
 }},
 {name:'Atap Berduri', hint:'Jangan lompat tinggi-tinggi.', build(){
   const m=blank(); fill(m,6,1,25,9,'#'); fill(m,6,10,25,10,'v'); pit(m,15,16);
   for(const x of [10,20]){ m[9][x]='.'; m[10][x]='.'; }
   return {m, ents:[block(10,9,9,10,{wait:.08,spiky:1}), block(20,9,19,20,{wait:.04,spiky:1}), door(28)], helpAt:3, help:'Tap ▲ sebentar = lompat pendek.'};
 }},
 {name:'Ngebut', hint:'Santai, jalan biasa aja.', build(){
   const m=blank(); pit(m,14,15); pit(m,21,22);
   return {m, ents:[zone(7,7,g=>{g.spd=2;say('Lho, kok ngebut?');sfx.trap();}), pop(25,25,14,25,25), door(28)]};
 }},
 {name:'Kaki Pegel', hint:'Lompatannya masih sama kok.', build(){
   const m=blank(); pit(m,10,11); pit(m,19,20);
   return {m, ents:[zone(5,5,g=>{g.jmul=.72;say('Kakinya pegel...');sfx.trap();}), door(28)]};
 }},
 {name:'Tangga Rapuh', hint:'Naik terus, jangan berhenti.', build(){
   const m=blank(); pit(m,5,30); fill(m,21,4,29,4,'#'); const e=[];
   for(const [x1,y] of [[6,12],[11,9],[16,6]]) for(let x=x1;x<x1+3;x++) e.push(crumble(x,y,.25));
   e.push(pop(24,24,3,23,24)); e.push(door(27,4)); return {m, ents:e};
 }},
 {name:'Pintu Nakal', hint:'Kali ini pintunya diem. Janji.', build(){
   const m=blank(); const spots=[280,90,200,40];
   const d=door(20,15,{i:0,tx:null,upd(e,g){
     const px=g.p.x+g.p.w/2;
     if(e.tx===null&&e.i<spots.length&&Math.abs(px-(e.x+5))<34){e.tx=spots[e.i++];sfx.trap();say(['Bohong.','Sini sini!','Capek ya?','Oke terakhir.'][e.i-1]);}
     if(e.tx!==null){const s=Math.sign(e.tx-e.x); e.x+=s*300*g.dt; if((e.tx-e.x)*s<=0){e.x=e.tx;e.tx=null;}}
     e.moving=e.tx!==null;
   }});
   return {m, ents:[d, pop(14,14,14,13,14,{cond:g=>d.i>=2}), pop(6,6,14,6,6,{cond:g=>d.i>=4})]};
 }},
 {name:'Jalan Gaib', hint:'Udah tau triknya kan?', build(){
   const m=blank(); pit(m,5,26); const e=[];

/* ---------- state ---------- */
const g={state:'menu',lv:0,p:null,m:null,ents:[],parts:[],msg:'',msgT:0,rev:false,idle:0,lvTime:0,
  deadT:0,fade:0,shake:0,lvDeaths:0,t0:0,dt:1/60,anim:0,saidRest:0};

function say(s,t=2.2){g.msg=s;g.msgT=t;}
function loadLevel(i,fresh){
  const L=LEVELS[i], b=L.build();
  g.lv=i; g.m=b.m; g.ents=b.ents; g.L=L; g.extra=b;
  g.p={x:2*T+1,y:150-11,w:7,h:11,vx:0,vy:0,ground:false,co:0,jb:0,face:1,on:null,walk:0};
  g.rev=!!L.rev; g.spd=L.spd||1; g.jmul=1; g.gmul=L.gmul||1; g.hasKey=0; g.fakeBanner=0; g.idle=0; g.lvTime=0; g.parts=[]; g.saidRest=0;
  if(fresh){g.lvDeaths=0; g.banner=2;}
  g.state='play';
  if(fresh) say(L.hint,3);
  else if(b.help&&g.lvDeaths>=b.helpAt) say(b.help,3);
  if(fresh&&g.L.rev) say(L.hint,3);
}

/* ---------- tabrakan ---------- */
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function tile(tx,ty){ if(tx<0||tx>=COLS||ty<0) return '#'; if(ty>=ROWS) return '.'; return g.m[ty][tx]; }
function solids(r){
  const out=[]; const x0=Math.floor(r.x/T),x1=Math.floor((r.x+r.w-.001)/T),y0=Math.floor(r.y/T),y1=Math.floor((r.y+r.h-.001)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) if(tile(x,y)==='#') out.push({x:x*T,y:y*T,w:T,h:T});
  for(const e of g.ents) if(e.solid&&ov(r,e)) out.push({x:e.x,y:e.y,w:e.w,h:e.h,ent:e});
  return out;
}

function die(){
  if(g.state!=='play') return;
  g.state='dead'; g.deadT=0; g.shake=.25; save.deaths++; g.lvDeaths++; store(); sfx.die();
  g.quip=QUIPS[(Math.random()*QUIPS.length)|0];
  const p=g.p, cols=[C.gold,'#4a78dc','#ffaab4',C.ink];
  for(let i=0;i<18;i++) g.parts.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:(Math.random()-.5)*220,vy:-Math.random()*240-40,c:cols[i%4],l:.9});
}

function win(){
  g.state='trans'; g.fade=0; sfx.door();
  const next=g.lv+1;
  if(next>=LEVELS.length){ save.lv=0; store(); g.nextFn=()=>{g.state='done'; g.endTime=(performance.now()-g.t0)/1000;}; }
  else { save.lv=next; store(); g.nextFn=()=>loadLevel(next,true); }
}

/* ---------- update ---------- */
function update(dt){
  g.anim+=dt; g.dt=dt;
  if(g.msgT>0) g.msgT-=dt;
  if(g.shake>0) g.shake-=dt;
  if(g.banner>0) g.banner-=dt;
  if(g.fakeBanner>0) g.fakeBanner-=dt;
  const jp=(keys.j&&!prevJ)||jTap; jTap=0; prevJ=keys.j;
  const lp=keys.l&&!prevL, rp=keys.r&&!prevR; prevL=keys.l; prevR=keys.r;
  if(DEV&&g.state==='menu'&&(lp||rp)){ save.lv=(save.lv+(rp?1:-1)+LEVELS.length)%LEVELS.length; store(); sfx.crack(); }

  if(g.state==='menu'||g.state==='done'){
    if(jp){ audioInit();
      if(g.state==='done'){ save.deaths=0; save.lv=0; store(); }
      if(!g.t0||g.state==='done') g.t0=performance.now();
      g.state='intro'; g.introT=0; g.introY=0; g.introVy=0; g.introDead=0; g.introOpen=0; g.ix=0; g.ifc=1; g.iwalk=0; g.letter=null; g.fallInHole=0; g.deadAt=0; g.introMsg='';
    }
    return;
  }
  if(g.state==='intro'){
    g.introT+=dt;
    const kill=msg=>{ if(g.introDead) return; g.introDead=1; g.introMsg=msg; g.deadAt=g.introT; save.deaths++; store(); sfx.die(); g.shake=.3; };
    if(!g.introOpen){ const d=(keys.r?1:0)-(keys.l?1:0); g.ix=Math.max(-115,Math.min(115,g.ix+d*70*dt)); if(d){g.ifc=d;g.iwalk+=dt;} else g.iwalk=0; }
    if(g.introT>1.5&&!g.introOpen){ g.introOpen=1; sfx.trap();
      if(Math.abs(g.ix)<26) g.fallInHole=1;
      else { const right=g.ix>0; g.letter={ch:right?'I':'H', x:right?W/2+36:W/2-36, y:50, vy:-60, tx:null, rot:0, landed:0}; say('',0); } }
    if(g.fallInHole){ g.introVy+=GRAV*.7*dt; g.introY+=g.introVy*dt; if(g.introY>40) kill('Baru mulai udah mati.'); }
    const L=g.letter;
    if(L){ if(!L.landed){ L.vy+=GRAV*.8*dt; L.y+=L.vy*dt;
        if(L.y+24>=H-31-34&&Math.abs(L.x-(W/2+g.ix))<24) kill('Ketiban huruf '+L.ch+'.');
        if(L.y>=H-31-24){ L.y=H-31-24; L.landed=1; g.shake=.2; sfx.crack(); } }
      else if(L.ch==='I') L.rot=Math.min(Math.PI/2,L.rot+dt*9); }
    if(L&&L.landed&&!g.introDead){ L.safeT=(L.safeT||0)+dt; if(L.safeT>1.2||jp){ g.introOpen=0; g.letter=null; loadLevel(save.lv,true); say('Lolos... kali ini.',2.5); return; } }
    if(g.introDead&&(g.introT-g.deadAt>2.4||(jp&&g.introT-g.deadAt>.4))){ g.introOpen=0; g.letter=null; loadLevel(save.lv,true); }
    return;
  }
  if(g.state==='trans'){ g.fade+=dt*2.5; if(g.fade>=1){ g.nextFn(); g.fade=1; } return; }

  for(const q of g.parts){ q.vy+=GRAV*.8*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.l-=dt; }
  g.parts=g.parts.filter(q=>q.l>0);

  if(g.state==='dead'){ g.deadT+=dt; if(jp&&g.deadT>.75) loadLevel(g.lv,false); return; }

  const p=g.p; g.lvTime+=dt;
  if(g.fade>0) g.fade=Math.max(0,g.fade-dt*3);
  const any=keys.l||keys.r||keys.j;
  g.idle = (!any&&p.ground)? g.idle+dt : 0;

  // gerak horizontal
  let dir=(keys.r?1:0)-(keys.l?1:0); if(g.rev) dir=-dir;
  const target=dir*RUN*g.spd, acc=p.ground?1400:900;
  if(p.vx<target) p.vx=Math.min(target,p.vx+acc*dt); else if(p.vx>target) p.vx=Math.max(target,p.vx-acc*dt);
  if(dir) p.face=dir;

  // lompat: coyote time + jump buffer
  if(jp) p.jb=.12; else p.jb-=dt;
  p.co = p.ground? .1 : p.co-dt;
  if(p.jb>0&&p.co>0){ p.vy=-JUMP*g.jmul; p.jb=0; p.co=0; p.ground=false; sfx.jump(); }
  if(p.spr&&p.vy>=0) p.spr=0;
  p.vy+=GRAV*g.gmul*dt*(!keys.j&&p.vy<0&&!p.spr?2.2:1);
  if(p.vy>MAXFALL) p.vy=MAXFALL;

  p.x+=p.vx*dt;
  for(const r of solids(p)){ if(p.vx>0) p.x=r.x-p.w; else if(p.vx<0) p.x=r.x+r.w; p.vx=0; }
  p.y+=p.vy*dt; p.ground=false; p.on=null;
  for(const r of solids(p)){
    if(p.vy>0){ p.y=r.y-p.h; p.ground=true; p.on=r.ent||null; }
    else if(p.vy<0){ p.y=r.y+r.h; }
    p.vy=0;
  }
  // nempel di lantai entitas
  if(!p.ground){ const below={x:p.x,y:p.y+p.h,w:p.w,h:.6}; for(const r of solids(below)){ if(p.vy>=0){p.ground=true;p.on=r.ent||null;} } }
  if(p.ground&&Math.abs(p.vx)>5) p.walk+=dt; else p.walk=0;

  const pcx=p.x+p.w/2;
  { const pr={x:p.x-1,y:p.y-1,w:p.w+2,h:p.h+2}; for(const e of g.ents) if(e.kind==='inv'&&!e.seen&&ov(pr,e)) e.seen=true; }
  for(const e of g.ents){
    if(e.trig&&!e.fired&&pcx>=e.trig[0]&&pcx<e.trig[1]&&(!e.cond||e.cond(g))){ e.fired=true; e.ft=0; }
    switch(e.kind){
      case 'pop': if(e.fired){ if(e.up===0) sfx.trap(); e.up=Math.min(1,e.up+dt*14);} break;
      case 'crumble':
        if(e.t===0&&p.on===e){ e.t=.0001; sfx.crack(); }
        if(e.t>0){ e.t+=dt; if(e.t>=e.delay){ e.solid=false; e.vy+=GRAV*dt; e.y+=e.vy*dt; } }
        break;
      case 'block':
        if(e.fired&&e.st===0){ e.ft+=dt; if(e.ft>=e.wait){ e.st=1; e.solid=false; sfx.trap(); } }
        if(e.st===1){
          e.vy=Math.min(MAXFALL,e.vy+GRAV*dt); e.y+=e.vy*dt;
          const by=Math.floor((e.y+e.h)/T), tx=Math.floor((e.x+1)/T);
          if(tile(tx,by)==='#'){ e.y=by*T-e.h; e.st=2; e.solid=true; g.shake=.12; }
          else for(const o of g.ents) if(o!==e&&o.kind==='block'&&o.st===2&&o.x===e.x&&e.y+e.h>o.y){ e.y=o.y-e.h; e.st=2; e.solid=true; }
          if(e.st===1&&ov(p,{x:e.x,y:e.y,w:e.w,h:e.h+(e.spiky?6:0)})) die();
        }
        break;
      case 'inv': if(p.on===e) e.seen=true; break;
      case 'tile': if(e.open&&e.fired&&e.solid){ e.solid=false; sfx.trap(); }
        if(e.openAt&&e.solid&&g.lvTime>=e.openAt){ e.solid=false; if(Math.random()<.3) sfx.crack(); } break;
      case 'spring': if(e.boing>0) e.boing-=dt;
        if(p.on===e&&p.vy>=0){ p.vy=-e.power; p.ground=false; p.co=0; p.spr=1; e.boing=.25; beep(200,900,.18,'square',.07); } break;
      case 'slider': if(!e.wait||g.lvTime>=e.wait){ e.x+=e.vx*dt; if(e.x<=e.x1){e.x=e.x1;e.vx=Math.abs(e.vx);} if(e.x+e.w>=e.x2){e.x=e.x2-e.w;e.vx=-Math.abs(e.vx);} } break;
      case 'blade': { const ph=(g.lvTime/e.period+(e.phase||0))*Math.PI*2; e.bx=e.cx+e.ax*Math.sin(ph); e.by=e.cy+e.ay*Math.sin(ph); } break;
      case 'riser': if(g.lvTime>=e.wait){ if(!e.go){e.go=1;say('Durinya naik!',1.5);sfx.trap();} e.y-=e.spd*dt; } break;
      case 'crusher': { const c=e.up+e.fall+e.down+e.rise, t=((g.lvTime+e.ph)%c+c)%c; let k;
        if(t<e.up){k=0;e.st='up';} else if(t<e.up+e.fall){k=(t-e.up)/e.fall;e.st='fall';} else if(t<e.up+e.fall+e.down){k=1;e.st='down';} else {k=1-(t-e.up-e.fall-e.down)/e.rise;e.st='rise';}
        const ny=e.y0+(e.y1-e.y0)*k; if(e.st==='fall'&&e.lastSt!=='fall') {} if(e.st==='down'&&e.lastSt==='fall'){ g.shake=Math.max(g.shake,.08); }
        e.lastSt=e.st; e.y=ny; } break;
      case 'key': if(!e.got){ const kx=e.x+4, ky=e.y+3, d=Math.hypot(pcx-kx,(p.y+p.h/2)-ky);
          if(e.tx==null&&e.i<e.spots.length&&d<30){ [e.tx,e.ty]=e.spots[e.i++]; sfx.trap(); say(e.lines?e.lines[e.i-1]:'Eh, kuncinya kabur!',1.6); }
          if(e.tx!=null){ const dx=e.tx-e.x, dy=e.ty-e.y, L2=Math.hypot(dx,dy), st=280*dt; if(L2<=st){e.x=e.tx;e.y=e.ty;e.tx=null;} else {e.x+=dx/L2*st;e.y+=dy/L2*st-0;} }
          else if(ov(p,e)){ e.got=1; g.hasKey=1; sfx.door(); say('Kunci dapet!',1.5); if(e.onGet) e.onGet(g); } } break;
      case 'logic': break;
      case 'mover': {
        if(!e.falling){ const ox=e.x; e.x+=e.vx*dt;
          if(e.x<=e.x1){e.x=e.x1;e.vx=Math.abs(e.vx);} if(e.x>=e.x2){e.x=e.x2;e.vx=-Math.abs(e.vx);}
          if(p.on===e){ p.x+=e.x-ox;
            if(e.boost&&!e.boosted){e.boosted=1;e.vx*=e.boost;say('Wah, ngebut!');sfx.trap();}
            if(e.fallAfter){ e.ft2=(e.ft2||0)+dt; if(e.ft2>=e.fallAfter){e.falling=1;e.solid=false;sfx.crack();} }
            if(e.crumbleAt&&!e.cr&&e.x>=e.crumbleAt){ e.cr=.0001; sfx.crack(); say('Krek... krek...',1.2); } }
          if(e.cr){ e.cr+=dt; if(e.cr>=.35){ e.falling=1; e.solid=false; sfx.crack(); } }
        } else { e.vy=(e.vy||0)+GRAV*dt; e.y+=e.vy*dt; }
      } break;
      case 'chase': if(g.lvTime>=e.wait){ if(!e.go){e.go=1;say('Lari!!',1.2);sfx.trap();} e.x+=e.spd*dt; if(ov(p,e.spd<0?{x:e.x,y:e.y,w:400,h:e.h}:e)) die(); } break;
      case 'zone': if(e.fired&&!e.done){ e.done=true; e.fn(g); } break;
    }
    if(e.upd) e.upd(e,g);
  }
  if(g.state!=='play') return;

  // bahaya
  const x0=Math.floor(p.x/T),x1=Math.floor((p.x+p.w)/T),y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){ const c=tile(x,y);
    if(c==='^'&&ov(p,{x:x*T+1,y:y*T+5,w:8,h:5})) return die();
    if(c==='v'&&ov(p,{x:x*T+1,y:y*T,w:8,h:5})) return die(); }
  for(const e of g.ents){
    if(e.kind==='pop'&&e.up>.4&&ov(p,{x:e.x+1,y:e.y+e.h-6*e.up,w:e.w-2,h:6})) return die();
  }
  for(const e of g.ents){
    if(e.kind==='slider'&&ov(p,{x:e.x+1,y:e.y+4,w:e.w-2,h:6})) return die();
    if(e.kind==='blade'&&e.bx!=null&&Math.hypot(pcx-e.bx,(p.y+p.h/2)-e.by)<e.r+4) return die();
    if(e.kind==='riser'&&p.y+p.h>e.y+3) return die();
    if(e.kind==='crusher'&&(e.st==='fall')&&ov(p,{x:e.x,y:e.y,w:e.w,h:e.h+5})) return die();
    if(e.kind==='crusher'&&e.st!=='up'&&ov(p,{x:e.x+1,y:e.y,w:e.w-2,h:e.h})) return die();
  }
  if(p.y>H+10) return die();
  // pintu
  for(const e of g.ents) if(e.kind==='door'&&!e.hidden&&ov(p,{x:e.x+2,y:e.y+2,w:6,h:12})){
    if(e.fakeWin){ e.hidden=1; g.fakeBanner=2.2; sfx.door(); for(const t of g.ents) if(t.drop) t.solid=false; continue; }
    if(e.fake){ say('Ketipu! Itu pintu palsu.',2.5); g.ents.push(Object.assign(pop(Math.floor(e.x/T)-1,Math.floor(e.x/T)+1,14,0,0),{up:1})); return die(); }
    if(e.locked){ if(g.msgT<=0) say('Kekunci. Hmm...',1.5); continue; }
    if(!e.moving) return win();
  }
}

/* ---------- gambar ---------- */
const SPR=[
"...kkkk...",
"..kyyyyk..",
".kyyyyyyk.",
".kkkkkkkk.",
".kppkpkpk.",
".kppppppk.",
"..kkkkkk..",
".kbbbbbbk.",
"kpkbbbbkpk",
"..kbbbbk..",
"..knkknk..",
"..kk..kk.."];
const SPR_W1=["..knkknk..",".kk....kk."], SPR_W2=["..knkknk..","...kkkk..."];
const SPR_AIR=["..knk.nk..",".kk...kk.."];
const PAL={k:C.ink,y:C.gold,p:'#ffaab4',b:'#4a78dc',n:'#7a5032'};
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function sprite(x,y,face,frame,scale=1){
  const rows=SPR.slice(0,10).concat(frame||SPR.slice(10));
  for(let r=0;r<12;r++)for(let c=0;c<10;c++){
    const ch=rows[r][face<0?9-c:c]; if(ch!=='.') px(x+c*scale,y+r*scale,scale,scale,PAL[ch]);
  }
}
function drawDeathCard(a){
  ctx.globalAlpha=a; px(0,0,W,H,'#2a2a2f');
  const cx=W/2-52, top=46, base=118;
  // sorotan lampu
  ctx.fillStyle='rgba(255,255,255,.07)'; ctx.beginPath(); ctx.moveTo(cx-7,top); ctx.lineTo(cx+7,top); ctx.lineTo(cx+26,base); ctx.lineTo(cx-26,base); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.16)'; ctx.beginPath(); ctx.ellipse(cx,base,28,5,0,0,Math.PI*2); ctx.fill();
  // garis-garis jatuh
  for(let k=0;k<6;k++){ const lx=cx-24+k*9+(k%2?3:0), ph=(g.anim*0.9+k*.37)%1; ctx.globalAlpha=a*(1-ph)*.8;
    px(lx,top+8+ph*40,1,8+(k%3)*3,'#d8d8d8'); }
  ctx.globalAlpha=a;
  // karakter mati (mata X)
  const sx=cx-15, sy=base-36; sprite(sx,sy,1,null,3);
  px(sx+9,sy+12,15,6,'#ffaab4');
  for(const ex of [sx+9,sx+18]){ for(let d=0;d<4;d++){ px(ex+d,sy+12+d,1,1,C.ink); px(ex+3-d,sy+12+d,1,1,C.ink);} }
  px(sx+12,sy+17,6,1,C.ink);
  text('x '+save.deaths,W/2-2,70,16,C.gold,'left');
  text(g.quip||'',W/2,130,7,C.bg);
  if(g.deadT>.75&&Math.floor(g.anim*2.2)%2===0) text('Tekan ▲ buat lanjut',W/2,148,7,C.gold);
  ctx.globalAlpha=1;
}
function spriteLying(x,y){ // karakter rebahan: kepala di kiri
  for(let r=0;r<12;r++)for(let c=0;c<10;c++){ const ch=SPR[r][c]; if(ch!=='.') px(x+r,y+(9-c),1,1,PAL[ch]); }
  px(x+4,y+3,1,1,C.ink); px(x+4,y+6,1,1,C.ink); // mata merem
}
function spikes(x,y,w,hgt){
  ctx.fillStyle=C.ink;
  for(let sx=x;sx<x+w;sx+=5){ ctx.beginPath(); ctx.moveTo(sx,y+hgt); ctx.lineTo(sx+2.5,y); ctx.lineTo(sx+5,y+hgt); ctx.fill(); }
}
function spikesDown(x,y,w,hgt){
  ctx.fillStyle=C.ink;
  for(let sx=x;sx<x+w;sx+=5){ ctx.beginPath(); ctx.moveTo(sx,y); ctx.lineTo(sx+2.5,y+hgt); ctx.lineTo(sx+5,y); ctx.fill(); }
}
function wallTile(x,y,tx,ty,c=C.wall){
  px(x,y,T,T,c);
  if(tile(tx,ty-1)!=='#'&&ty>0) px(x,y,T,2,C.wallL);
  px(x,y+T-1,T,1,C.wallD);
}
function text(s,x,y,size=8,col=C.ink,align='center'){
  ctx.font=size+"px 'Press Start 2P', monospace"; ctx.textAlign=align; ctx.textBaseline='top';
  ctx.fillStyle=col; ctx.fillText(s,x,y);
}
function drawDoor(e){
  const x=Math.round(e.x), y=Math.round(e.y), body=e.locked?C.grey:C.door;
  px(x+2,y,6,1,body); px(x+1,y+1,8,1,body); px(x,y+2,10,12,body);
  px(x+2,y+3,6,11,e.locked?'#6d6d76':'#3d3d4c');
  px(x+6,y+8,2,2,e.locked?C.ink:C.gold);
  if(!e.locked&&!e.fake){ const a=(Math.sin(g.anim*4)+1)/2; ctx.globalAlpha=.25+.25*a; px(x+3,y+4,4,1,C.gold); ctx.globalAlpha=1; }
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  const sc=Math.min(cv.width/W, cv.height/H), ox=(cv.width-W*sc)/2, oy=(cv.height-H*sc)/2;
  if(ox>0){ ctx.fillStyle=C.wall; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle=C.wallD;
    for(let y=T-1;y<H;y+=T) ctx.fillRect(0,oy+y*sc,cv.width,Math.max(1,sc)); }
  ctx.setTransform(sc,0,0,sc,ox,oy);
  let sx=0,sy=0; if(g.shake>0){sx=(Math.random()-.5)*3;sy=(Math.random()-.5)*3;}
  ctx.save(); ctx.translate(Math.round(sx),Math.round(sy));

  if(g.state==='menu'||g.state==='done'||g.state==='intro'){ drawMenu(); ctx.restore(); return; }

  px(0,0,W,H,C.bg);
  const mir=g.L&&g.L.mirror; if(mir){ ctx.save(); ctx.translate(W,0); ctx.scale(-1,1); }
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const c=g.m[ty][tx];
    if(c==='#') wallTile(tx*T,ty*T,tx,ty);
    else if(c==='^') spikes(tx*T,ty*T+4,T,6);
    else if(c==='v') spikesDown(tx*T,ty*T,T,6);
  }
  for(const e of g.ents){
    if(e.kind==='crumble'){ const j=(e.t>0&&e.solid)?Math.round((Math.random()-.5)*1.4):0;
      px(e.x+j,e.y,T,T,C.wall); px(e.x+j,e.y,T,2,C.wallL); if(e.t>0){px(e.x+3+j,e.y+3,1,4,C.crack);px(e.x+6+j,e.y+5,1,3,C.crack);} }
    else if(e.kind==='fake'){ px(e.x,e.y,T,T,C.wall); px(e.x,e.y,T,2,C.wallL); }
    else if(e.kind==='block'){ px(e.x,e.y,T,T,C.wall); px(e.x,e.y+T-1,T,1,C.wallD); if(e.st===2) px(e.x,e.y,T,2,C.wallL); if(e.spiky&&e.st<2) spikesDown(e.x,e.y+T,T,6); }
    else if(e.kind==='inv'&&e.seen){ ctx.globalAlpha=.35; px(e.x,e.y,T,T,C.wall); ctx.globalAlpha=1; }
    else if(e.kind==='pop'&&e.up>0) spikes(e.x,e.y+e.h-6*e.up,e.w,6*e.up);
    else if(e.kind==='door'){ if(!e.hidden) drawDoor(e); }
    else if(e.kind==='mover'){ const j=(e.cr&&!e.falling)?Math.round((Math.random()-.5)*2):0; px(e.x+j,e.y,e.w,e.h,C.wall); if(e.cr){px(e.x+8+j,e.y+3,1,5,C.crack);px(e.x+19+j,e.y+4,1,4,C.crack);} px(e.x,e.y,e.w,2,C.gold); px(e.x,e.y+e.h-1,e.w,1,C.wallD); }
    else if(e.kind==='tile'&&e.solid){ const j=(e.openAt&&g.lvTime>e.openAt-.4)?Math.round((Math.random()-.5)*1.6):0;
      px(e.x+j,e.y,T,T,C.wall); px(e.x+j,e.y,T,2,C.wallL); px(e.x+j,e.y+T-1,T,1,C.wallD); if(j||(e.openAt&&g.lvTime>e.openAt-.4)){px(e.x+4+j,e.y+3,1,4,C.crack);} }
    else if(e.kind==='spring'){ const c=e.boing>0; px(e.x,e.y+7,T,3,C.wallD); px(e.x+2,e.y+(c?3:5),1,2,C.grey); px(e.x+7,e.y+(c?3:5),1,2,C.grey);
      px(e.x+3,e.y+(c?4:6),4,1,C.grey); px(e.x,e.y+(c?1:3),T,2,C.red); }
    else if(e.kind==='slider'){ spikes(e.x,e.y+4,e.w,6); px(e.x,e.y+9,e.w,1,C.red); }
    else if(e.kind==='blade'&&e.bx!=null){ const a=g.anim*12; ctx.fillStyle=C.grey; ctx.beginPath(); ctx.arc(e.bx,e.by,e.r-1,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=C.ink; for(let k=0;k<8;k++){ const t=a+k*Math.PI/4; ctx.beginPath(); ctx.moveTo(e.bx+Math.cos(t)*(e.r-1),e.by+Math.sin(t)*(e.r-1));
        ctx.lineTo(e.bx+Math.cos(t+.25)*(e.r+2),e.by+Math.sin(t+.25)*(e.r+2)); ctx.lineTo(e.bx+Math.cos(t+.5)*(e.r-1),e.by+Math.sin(t+.5)*(e.r-1)); ctx.fill(); }
      px(Math.round(e.bx)-1,Math.round(e.by)-1,2,2,C.ink); }
    else if(e.kind==='riser'&&e.y<H){ spikes(0,e.y,W,6); px(0,e.y+6,W,H,C.ink); }
    else if(e.kind==='crusher'){ px(e.x,e.y,e.w,e.h,'#5c5c66'); px(e.x,e.y,e.w,2,'#77777f'); px(e.x,e.y+e.h-2,e.w,2,'#3d3d45'); spikesDown(e.x,e.y+e.h,e.w,5); }
    else if(e.kind==='key'&&!e.got){ const kx=Math.round(e.x), ky=Math.round(e.y)+Math.round(Math.sin(g.anim*4));
      px(kx,ky,4,5,C.gold); px(kx+1,ky+1,2,3,C.bg); px(kx+4,ky+2,4,1,C.gold); px(kx+6,ky+3,1,2,C.gold); px(kx+7,ky+3,1,1,C.gold); }
    else if(e.kind==='fspike') spikes(e.x,e.y+4,e.w,6);
    else if(e.kind==='chase'&&e.spd<0&&e.x<W){ px(e.x+2,e.y,W,e.h,C.ink); ctx.fillStyle=C.ink;
      for(let yy=e.y;yy<e.y+e.h;yy+=6){ctx.beginPath();ctx.moveTo(e.x+2,yy);ctx.lineTo(e.x-4,yy+3);ctx.lineTo(e.x+2,yy+6);ctx.fill();} }
    else if(e.kind==='chase'&&e.spd>0&&e.x>-10){ px(e.x-40,e.y,e.w+38,e.h,C.ink); ctx.fillStyle=C.ink;
      for(let yy=e.y;yy<e.y+e.h;yy+=6){ctx.beginPath();ctx.moveTo(e.x+e.w-2,yy);ctx.lineTo(e.x+e.w+4,yy+3);ctx.lineTo(e.x+e.w-2,yy+6);ctx.fill();} }
  }
  // pemain
  if(g.state==='play'||g.state==='trans'){
    const p=g.p; let fr=null;
    if(!p.ground) fr=SPR_AIR; else if(p.walk>0) fr=(Math.floor(p.walk*10)%2)?SPR_W1:SPR_W2;
    sprite(Math.round(p.x)-1,Math.round(p.y+p.h)-12,p.face,fr);
  }
  for(const q of g.parts) px(Math.round(q.x),Math.round(q.y),2,2,q.c);
  if(mir) ctx.restore();


  if(g.L&&g.L.dark&&(g.state==='play'||g.state==='dead')){
    const p=g.p, cx=p.x+p.w/2, cy=p.y+p.h/2;
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.arc(cx,cy,42,0,Math.PI*2,true);
    ctx.fillStyle='rgba(16,24,26,.97)'; ctx.fill(); ctx.restore(); }
  // HUD di atas tembok atap
  text('LV '+(g.lv+1)+'/'+LEVELS.length,4,1,8,C.bg,'left');
  text((DEV?'DEV · ':'')+'MATI '+save.deaths,W-4,1,8,C.bg,'right');
  if(g.L.name==='Sabar'&&g.ents[2].locked&&g.idle>.5){ const n=Math.max(0,7-g.idle); text('.'.repeat(Math.ceil(7-n)),W/2,1,8,C.gold); }

  if(g.state==='dead'&&g.deadT>.55){ drawDeathCard(Math.min(1,(g.deadT-.55)*4)); }
  else if(g.fakeBanner>0){ px(0,58,W,34,'#1f6b3a'); text('LEVEL SELESAI!',W/2,64,12,C.gold);
    text(g.fakeBanner<1.4?'...BOHONG HAHAHA':'Hebat banget kamu!',W/2,81,7,C.bg); }
  else if(g.banner>0){ const a=Math.min(1,g.banner*2); ctx.globalAlpha=a;
    px(0,62,W,30,C.ink); text('LEVEL '+(g.lv+1),W/2,70,14,C.gold); ctx.globalAlpha=1; }
  else if(g.msgT>0){ ctx.globalAlpha=Math.min(1,g.msgT*3);
    const fs=g.msg.length*8+14>W-12?7:8, w=Math.min(W-12,g.msg.length*fs+14); px((W-w)/2,22,w,16,C.ink); text(g.msg,W/2,26,fs,C.bg); ctx.globalAlpha=1; }

  if(g.state==='trans'||g.fade>0){ ctx.globalAlpha=Math.min(1,g.fade); px(0,0,W,H,C.ink); ctx.globalAlpha=1; }
  ctx.restore();
}

function drawMenu(){
  px(0,0,W,H,C.wall);
  for(let x=0;x<W;x+=T) px(x,H-30,T,30,(x/T)%2?C.wallD:'#1f625a');
  px(0,H-31,W,2,C.wallL);
  spikes(40,H-36,30,6); spikes(250,H-36,30,6);
  const bob=Math.round(Math.sin(g.anim*3)*2);
  if(g.state==='menu'||g.state==='intro'){
    text('HATI',W/2,22,24,C.ink); text('HATI',W/2,20,24,C.gold);
    for(let i=0;i<4;i++){ const ch='HATI'[i]; if(g.state==='intro'&&g.letter&&((g.letter.ch==='H'&&i===0)||(g.letter.ch==='I'&&i===3))) continue;
      text(ch,W/2-36+i*24,52,24,C.ink); text(ch,W/2-36+i*24,50,24,C.bg); }
    if(g.state==='intro'){
      if(g.introOpen){ px(W/2-21,H-31,42,31,'#0e1f1c'); spikes(W/2-20,H-8,40,8); }
      const chx=Math.round(W/2-15+g.ix);
      if(!g.introDead){ const fr=g.fallInHole?SPR_AIR:(g.iwalk>0?((Math.floor(g.iwalk*8)%2)?SPR_W1:SPR_W2):null);
        sprite(chx,H-31-36+Math.round(g.introY),g.ifc,fr,3); }
      else if(!g.fallInHole){ ctx.save(); ctx.translate(chx,H-31); ctx.scale(1,.22); sprite(0,-36,g.ifc,null,3); ctx.restore(); }
      if(g.fallInHole&&!g.introDead) text('Lho?',W/2+22,H-80,8,C.gold,'left');
      const L=g.letter;
      if(L){ ctx.save(); ctx.translate(Math.round(L.x),Math.round(L.y)+12); ctx.rotate(L.rot);
        if(L.rot>0) ctx.translate(0,L.rot/(Math.PI/2)*8);
        text(L.ch,0,-10,24,C.ink); text(L.ch,0,-12,24,C.bg); ctx.restore();
        if(!g.introDead&&!L.landed) text('!!',chx+30,H-80,8,C.gold,'left'); }
      if(g.introDead){ px(W/2-90,96,180,24,C.ink); text(g.introMsg,W/2,100,7,C.gold); text('MATI KE-'+save.deaths,W/2,111,6,C.bg); }
    } else sprite(W/2-15,H-31-36+bob,1,null,3);
    const blink=Math.floor(g.anim*2)%2===0;
    if(blink&&g.state==='menu') text('Tekan ▲ buat mulai',W/2,90,8,C.bg);
    if(g.state==='intro'){}
    else if(DEV){ px(W/2-110,100,220,22,C.ink); text('DEV ◀ ▶  Level '+(save.lv+1)+': '+LEVELS[save.lv].name,W/2,104,6,C.gold); text('pilih level, ▲ buat mulai',W/2,114,5,C.bg); }
    else text(save.lv>0?'Lanjut dari Level '+(save.lv+1):LEVELS.length+' level. Banyak jebakan.',W/2,104,6,C.gold);
    text('Total mati: '+save.deaths,W/2,H-20,6,C.bg);
  } else {
    text('KAMU LOLOS!',W/2,22,16,C.ink); text('KAMU LOLOS!',W/2,20,16,C.gold);
    text('Mati '+save.deaths+' kali',W/2,50,8,C.bg);
    const t=g.endTime||0; text('Waktu '+Math.floor(t/60)+'m '+Math.floor(t%60)+'d',W/2,64,8,C.bg);
    text(save.deaths<=10?'Hati-hati banget kamu.':'Lain kali lebih hati-hati.',W/2,82,6,C.gold);
    sprite(W/2-15,H-31-36+bob,1,SPR_AIR,3);
    if(Math.floor(g.anim*2)%2===0) text('Tekan ▲ main lagi',W/2,100,8,C.bg);
  }
}

/* ---------- loop ---------- */
let last=performance.now(), accT=0; const STEP=1/60;
function frame(now){
  accT+=Math.min(.1,(now-last)/1000); last=now;
  { const show=g.state==='menu'; if(rsEl.hidden===show) rsEl.hidden=!show; }
  while(accT>=STEP){ update(STEP); accT-=STEP; }
  draw(); requestAnimationFrame(frame);
}
function start(){ fit(); requestAnimationFrame(t=>{last=t;frame(t);}); }
(document.fonts&&document.fonts.load? document.fonts.load("8px 'Press Start 2P'").catch(()=>{}) : Promise.resolve()).then(start);
})();
</script>
